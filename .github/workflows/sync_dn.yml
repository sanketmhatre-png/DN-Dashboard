name: Sync BOM data

on:
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      full:
        description: "Re-export every month (slow)"
        type: boolean
        default: false
  # Uncomment to also refresh automatically every day at 10:00 AM IST:
  # schedule:
  #   - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: repo-data-sync         # don't push at the same time as another sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Export BOM data from Metabase
        env:
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}   # optional; used instead of login if set
        run: python sync_bom.py ${{ inputs.full && '--full' || '' }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bom/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "BOM data sync $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
